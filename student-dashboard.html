<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard | Roshd Academy</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#f4f6f8;color:#1c2733;min-height:100vh;border:10px solid #102a43}.dashboard-header{background:#102a43;color:#fff;padding:25px 30px}.dashboard-header h1{font-size:28px;margin-bottom:8px}.dashboard-header p{font-size:15px;opacity:.9}.dashboard-container{width:100%;max-width:1100px;margin:35px auto;padding:0 20px}.section{background:#fff;border:2px solid #102a43;border-radius:12px;padding:25px;margin-bottom:30px}.section-title{color:#102a43;margin-bottom:20px;font-size:24px}.student-info p{margin:8px 0;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}.card{background:#fff;border:1.5px solid #102a43;border-radius:10px;padding:20px}.card h3{color:#102a43;margin-bottom:12px}.card p{margin:7px 0;line-height:1.5}.status{display:inline-block;margin-top:10px;padding:7px 10px;border:1px solid #102a43;border-radius:6px;font-size:13px}.link{display:inline-block;margin-top:12px;padding:10px 15px;background:#102a43;color:#fff;text-decoration:none;border:2px solid #102a43;border-radius:7px}.link:hover{background:#fff;color:#102a43}.material-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.material-actions .link{margin-top:0}.file-size{color:#555;font-size:14px}.logout-button{width:100%;padding:13px 25px;background:#102a43;color:#fff;border:2px solid #102a43;border-radius:7px;cursor:pointer;font-size:15px}.logout-button:hover{background:#fff;color:#102a43}.message{color:#555;line-height:1.6}.error-message{color:#8b0000;line-height:1.6}@media(max-width:600px){body{border-width:6px}.dashboard-header{padding:22px 18px}.dashboard-header h1{font-size:23px}.dashboard-container{margin:25px auto;padding:0 15px}.section{padding:20px}.section-title{font-size:21px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="dashboard-header"><h1>Student Dashboard</h1><p>Roshd Academy</p></header>
<main class="dashboard-container">
<section class="section student-info"><h2 class="section-title">My Information</h2><p><strong>Name:</strong> <span id="studentName">Loading...</span></p><p><strong>Email:</strong> <span id="studentEmail">Loading...</span></p><p><strong>Account Status:</strong> <span id="accountStatus">Loading...</span></p></section>
<section class="section"><h2 class="section-title">My Classes</h2><div id="classesContainer" class="grid"><p class="message">Loading your classes...</p></div></section>
<section class="section"><h2 class="section-title">My Schedule</h2><div id="scheduleContainer" class="grid"><p class="message">Loading your schedule...</p></div></section>
<section class="section"><h2 class="section-title">Class Announcements</h2><div id="announcementContainer" class="grid"><p class="message">Loading announcements...</p></div></section>
<section class="section"><h2 class="section-title">Course Materials</h2><div id="materialsContainer" class="grid"><p class="message">Loading course materials...</p></div></section>
<section class="section"><h2 class="section-title">Account</h2><button id="logoutButton" class="logout-button">Log Out</button></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://zrwxwkbyqclmgsjdwmup.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_Nd5Do5kgTtq5-_CjYz8qoA_w-LbrH0g";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let myClasses=[];
async function loadStudentDashboard(){
 const {data:{user},error:authError}=await supabaseClient.auth.getUser();
 if(authError||!user){window.location.href="login.html";return;}
 const {data:profile,error:profileError}=await supabaseClient.from("profiles").select("full_name,email,role,account_status").eq("id",user.id).single();
 if(profileError){console.error(profileError);showError("classesContainer","Could not load your profile.");return;}
 if(profile.role!=="student"||profile.account_status!=="active"){window.location.href="login.html";return;}
 document.getElementById("studentName").textContent=profile.full_name||"Not specified";
 document.getElementById("studentEmail").textContent=profile.email||user.email||"Not specified";
 document.getElementById("accountStatus").textContent=profile.account_status||"Not specified";
 await loadStudentClasses(user.id);
}
async function loadStudentClasses(studentId){
 const {data:enrollments,error}=await supabaseClient.from("enrollments").select("class_id,status,approved_at,created_at").eq("student_id",studentId);
 if(error){console.error(error);showError("classesContainer","Could not load your enrollments.");return;}
 if(!enrollments||enrollments.length===0){showMessage("classesContainer","You are not enrolled in any classes yet.");showMessage("scheduleContainer","Your schedule will appear here after you are approved for a class.");showMessage("announcementContainer","There are no class announcements to show yet.");showMessage("materialsContainer","Your course materials will appear here after you are approved for a class.");return;}
 const classIds=enrollments.map(x=>x.class_id);
 const {data:classes,error:classesError}=await supabaseClient.from("classes").select("*").in("id",classIds);
 if(classesError){console.error(classesError);showError("classesContainer","Could not load class information.");return;}
 myClasses=classes||[];renderClasses(enrollments,myClasses);
 const approvedClassIds=enrollments.filter(x=>x.status==="approved").map(x=>x.class_id);
 if(approvedClassIds.length===0){showMessage("scheduleContainer","Your schedule will appear here after your enrollment is approved.");showMessage("announcementContainer","Class announcements will appear here after your enrollment is approved.");showMessage("materialsContainer","Course materials will appear here after your enrollment is approved.");return;}
 await loadSchedules(approvedClassIds);await loadAnnouncements(approvedClassIds);await loadMaterials(approvedClassIds);
}
function renderClasses(enrollments,classes){const c=document.getElementById("classesContainer");c.innerHTML="";classes.forEach(course=>{const e=enrollments.find(x=>Number(x.class_id)===Number(course.id));const card=document.createElement("div");card.className="card";card.innerHTML="<h3>"+escapeHtml(course.name||"Class")+"</h3><p><strong>Level:</strong> "+escapeHtml(course.level||"Not specified")+"</p><p><strong>Duration:</strong> "+escapeHtml(course.duration||"Not specified")+"</p><p><strong>Teacher:</strong> "+escapeHtml(course.instructor||course.instructor_name||course.teacher_name||"Not specified")+"</p><p><strong>Platform:</strong> "+escapeHtml(course.platform||"Not specified")+"</p><span class='status'>Enrollment: "+escapeHtml(e?.status||"pending")+"</span>";c.appendChild(card);});}
async function loadSchedules(ids){const c=document.getElementById("scheduleContainer");const {data:schedules,error}=await supabaseClient.from("schedules").select("*").in("class_id",ids);if(error){console.error(error);showError("scheduleContainer","Could not load your schedule.");return;}if(!schedules||!schedules.length){showMessage("scheduleContainer","No separate schedule has been added yet.");return;}c.innerHTML="";schedules.forEach(s=>{const course=myClasses.find(x=>Number(x.id)===Number(s.class_id));const card=document.createElement("div");card.className="card";card.innerHTML="<h3>"+escapeHtml(course?.name||"Class")+"</h3>"+formatObjectFields(s,["id","class_id","created_at","updated_at"]);c.appendChild(card);});}
async function loadAnnouncements(ids){const c=document.getElementById("announcementContainer");const {data:items,error}=await supabaseClient.from("class_announcements").select("*").in("class_id",ids).order("created_at",{ascending:false});if(error){console.error(error);showError("announcementContainer","Could not load class announcements.");return;}if(!items||!items.length){showMessage("announcementContainer","There are no announcements yet.");return;}c.innerHTML="";items.forEach(item=>{const course=myClasses.find(x=>Number(x.id)===Number(item.class_id));const card=document.createElement("div");card.className="card";let h="<h3>"+escapeHtml(item.title||"Announcement")+"</h3><p><strong>Class:</strong> "+escapeHtml(course?.name||"Class")+"</p><p>"+escapeHtml(item.content||"")+"</p>";if(item.link)h+="<a class='link' href='"+escapeAttribute(item.link)+"' target='_blank' rel='noopener'>Open Link</a>";card.innerHTML=h;c.appendChild(card);});}
async function loadMaterials(ids){const c=document.getElementById("materialsContainer");const {data:items,error}=await supabaseClient.from("course_materials").select("*").in("class_id",ids).order("created_at",{ascending:false});if(error){console.error(error);showError("materialsContainer","Could not load course materials.");return;}if(!items||!items.length){showMessage("materialsContainer","No course materials have been uploaded yet.");return;}c.innerHTML="";for(const item of items){const course=myClasses.find(x=>Number(x.id)===Number(item.class_id));const card=document.createElement("div");card.className="card";let h="<h3>"+escapeHtml(item.title||"Course Material")+"</h3><p><strong>Class:</strong> "+escapeHtml(course?.name||"Class")+"</p>";if(item.description)h+="<p>"+escapeHtml(item.description)+"</p>";if(item.file_type)h+="<p><strong>Type:</strong> "+escapeHtml(item.file_type)+"</p>";if(item.file_size!==null&&item.file_size!==undefined)h+="<p class='file-size'><strong>Size:</strong> "+escapeHtml(formatFileSize(item.file_size))+"</p>";else h+="<p class='file-size'><strong>Size:</strong> Not recorded for this older upload</p>";if(item.file_url){let filePath=item.file_url;const marker="/course-materials/";const markerIndex=filePath.indexOf(marker);if(markerIndex!==-1){filePath=decodeURIComponent(filePath.substring(markerIndex+marker.length));}const openResult=await supabaseClient.storage.from("course-materials").createSignedUrl(filePath,3600);const downloadResult=await supabaseClient.storage.from("course-materials").createSignedUrl(filePath,3600,{download:true});if(!openResult.error&&openResult.data&&openResult.data.signedUrl&&!downloadResult.error&&downloadResult.data&&downloadResult.data.signedUrl){h+="<div class='material-actions'><a class='link' href='"+escapeAttribute(openResult.data.signedUrl)+"' target='_blank' rel='noopener'>View / Open</a><a class='link' href='"+escapeAttribute(downloadResult.data.signedUrl)+"' download>Download</a></div>";}else{console.error("Material signed URL error:",openResult.error||downloadResult.error);h+="<p class='error-message'>Material links are temporarily unavailable.</p>";}}card.innerHTML=h;c.appendChild(card);}}
function formatFileSize(bytes){const n=Number(bytes);if(!Number.isFinite(n)||n<0)return "Unknown";if(n<1024)return n+" B";if(n<1024*1024)return (n/1024).toFixed(1)+" KB";if(n<1024*1024*1024)return (n/(1024*1024)).toFixed(1)+" MB";return (n/(1024*1024*1024)).toFixed(2)+" GB";}
function formatObjectFields(o,ignore){let h="";Object.keys(o).forEach(k=>{if(ignore.includes(k)||o[k]===null||o[k]===undefined||o[k]==="")return;const label=k.replace(/_/g," ").replace(/\b\w/g,l=>l.toUpperCase());h+="<p><strong>"+escapeHtml(label)+":</strong> "+escapeHtml(String(o[k]))+"</p>";});return h||"<p>Schedule details are not specified.</p>";}
function showMessage(id,m){document.getElementById(id).innerHTML="<p class='message'>"+escapeHtml(m)+"</p>";}function showError(id,m){document.getElementById(id).innerHTML="<p class='error-message'>"+escapeHtml(m)+"</p>";}
function escapeHtml(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}function escapeAttribute(v){return String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
document.getElementById("logoutButton").addEventListener("click",async()=>{const {error}=await supabaseClient.auth.signOut();if(error){console.error(error);return;}window.location.href="login.html";});
loadStudentDashboard();
</script>
</body>
</html>
